<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#081A1C;--bg1:#0C2A2A;
  --ink:#EAF6F0;--soft:rgba(234,246,240,.55);--faint:rgba(234,246,240,.35);
  --neon:#46E39A;--lime:#C7F94B;--yellow:#FFE14D;--on-accent:#06231B;
  --glass:rgba(255,255,255,.05);--glassB:rgba(255,255,255,.10);
  --fd:'Archivo',sans-serif;--fb:'Space Grotesk',sans-serif;
}
html{background:var(--bg0)}
body{
  font-family:var(--fb);color:var(--ink);min-height:100vh;font-size:15px;
  max-width:440px;margin:0 auto;padding:0 0 5rem;
  background:
    repeating-linear-gradient(102deg, rgba(70,227,154,.035) 0 46px, transparent 46px 92px),
    radial-gradient(120% 55% at 50% -8%, var(--bg1), var(--bg0) 72%);
  background-attachment:fixed;
}

/* ── HEADER ── */
.hdr{padding:38px 18px 0}
.brand-row{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:8px}
.logo-chip{width:30px;height:30px;border-radius:9px;background:var(--neon);display:grid;place-items:center;box-shadow:0 0 12px rgba(70,227,154,.5);flex-shrink:0}
.brand-name{font-family:var(--fb);font-weight:700;font-size:15px;letter-spacing:1.5px;color:var(--ink);white-space:nowrap}
.brand-name b{color:var(--neon);font-weight:700}
.brand-sub{font-family:var(--fb);font-weight:500;font-size:9.5px;letter-spacing:1px;color:var(--faint);text-align:right;line-height:1.5}
.title-row{display:flex;align-items:center;gap:10px;margin-top:11px}
.title{font-family:var(--fd);font-weight:800;font-size:40px;letter-spacing:-.5px;line-height:1}
.chips{display:flex;gap:8px;margin-top:14px;margin-bottom:16px;flex-wrap:wrap}
.chip{
  position:relative;display:inline-flex;align-items:center;gap:6px;height:31px;padding:0 12px;
  border-radius:9px;font-family:var(--fb);font-weight:600;font-size:12.5px;white-space:nowrap;
  background:var(--glass);color:var(--ink);border:1px solid var(--glassB);cursor:pointer;
}
.chip.solid{background:var(--neon);color:var(--on-accent);border:none}
.chip select{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer;font-size:16px}
.chip-flag{height:13px;width:auto;border-radius:2px;display:none}
.chip-flag.visible{display:inline-block}
.caret{flex-shrink:0}

/* ── HERO ── */
.wrap{padding:0 18px}
.hero{
  position:relative;border-radius:20px;padding:18px;overflow:hidden;margin-bottom:13px;
  background:linear-gradient(160deg, rgba(70,227,154,.16), rgba(255,255,255,.04));
  border:1px solid var(--glassB);box-shadow:0 18px 40px -18px rgba(0,0,0,.7);
}
.hero-pitch{position:absolute;inset:0;pointer-events:none}
.hero-glow{position:absolute;top:-50px;right:-30px;width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle, rgba(199,249,75,.18), transparent 70%);pointer-events:none}
.hero-inner{position:relative}
.hero-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.hero-label{display:inline-flex;align-items:center;gap:6px;font-family:var(--fb);font-weight:700;font-size:11px;letter-spacing:1.5px;color:var(--neon);white-space:nowrap}
.hero-date{font-family:var(--fb);font-weight:500;font-size:12px;color:var(--soft)}
.hero-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin-bottom:18px}
.hero-team{display:flex;flex-direction:column;align-items:center;gap:9px}
.hero-flag{width:46px;height:auto;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);display:block}
.hero-name{font-family:var(--fd);font-weight:800;font-size:17px;letter-spacing:.3px;color:var(--ink)}
.hero-vs{display:flex;flex-direction:column;align-items:center;gap:5px}
.hero-vs-label{font-family:var(--fd);font-weight:800;font-size:11px;color:var(--faint);letter-spacing:1px}
.cd{display:flex;justify-content:space-between;gap:7px;margin-bottom:16px}
.cd-cell{flex:1;text-align:center;border:1px solid var(--glassB);border-radius:12px;padding:9px 0;
  background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03))}
.cd-num{font-family:var(--fd);font-weight:800;font-size:27px;line-height:1;color:var(--yellow)}
.cd-unit{font-family:var(--fb);font-weight:600;font-size:8.5px;letter-spacing:1.5px;color:var(--faint);margin-top:3px}
.hero-venue{display:flex;align-items:center;gap:6px;justify-content:center;margin-bottom:14px;
  font-family:var(--fb);font-weight:500;font-size:12px;color:var(--soft)}
.cta{display:flex;gap:9px}
.cta-btn{flex:1;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;
  font-family:var(--fb);font-weight:700;font-size:12.5px;letter-spacing:.2px;cursor:pointer;text-decoration:none;border:none}
.cta-btn.solid{background:var(--neon);color:var(--on-accent)}
.cta-btn.outline{background:transparent;color:var(--ink);border:1px solid var(--glassB)}
.cta-btn svg{width:14px;height:14px;flex-shrink:0}
.live-now{text-align:center;font-family:var(--fd);font-weight:800;font-size:15px;color:var(--yellow);letter-spacing:1px}

/* ── SECTION HEADER ── */
.sec-head{display:flex;align-items:center;gap:10px;margin:2px 0 0}
.sec-name{font-family:var(--fd);font-weight:800;font-size:14px;letter-spacing:1px;color:var(--ink);white-space:nowrap;text-transform:uppercase}
.sec-rule{flex:1;height:1px;background:var(--glassB)}
.sec-count{font-family:var(--fb);font-weight:600;font-size:11.5px;color:var(--neon);white-space:nowrap}

/* ── FIXTURE CARD ── */
.add-all{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;
  height:42px;border-radius:12px;background:var(--neon);color:var(--on-accent);border:none;cursor:pointer;
  font-family:var(--fb);font-weight:700;font-size:13px;letter-spacing:.2px;transition:opacity .15s}
.add-all:hover{opacity:.88}
.add-all svg{width:15px;height:15px}
.fx{position:relative;border-radius:16px;overflow:hidden;background:var(--glass);border:1px solid var(--glassB);margin-top:9px}
.fx-bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--neon),var(--lime))}
.fx-in{display:flex;gap:11px;padding:11px 13px 11px 14px}
.fx-rail{width:38px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.fx-dow{font-family:var(--fb);font-weight:600;font-size:9px;letter-spacing:1px;color:var(--neon)}
.fx-day{font-family:var(--fd);font-weight:800;font-size:23px;line-height:1;color:var(--ink)}
.fx-mon{font-family:var(--fb);font-weight:600;font-size:8.5px;letter-spacing:1px;color:var(--faint)}
.fx-main{flex:1;min-width:0}
.fx-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.fx-time{font-family:var(--fb);font-weight:600;font-size:12px;color:var(--ink);white-space:nowrap}
.fx-time b{color:var(--yellow);font-weight:700}
.fx-time span{color:var(--faint)}
.fx-cal{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:7px;
  border:1px solid rgba(70,227,154,.45);color:var(--neon);font-family:var(--fb);font-weight:700;font-size:10.5px;
  background:none;cursor:pointer;white-space:nowrap}
.fx-cal svg{width:11px;height:11px}
.fx-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;margin-bottom:9px}
.fx-side{display:flex;align-items:flex-start;gap:7px;min-width:0}
.fx-side.away{justify-content:flex-end}
.fx-flag{border-radius:5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);flex-shrink:0;display:block;margin-top:1px}
.fx-tname{font-family:var(--fd);font-weight:800;font-size:13.5px;color:var(--ink);letter-spacing:.2px;line-height:1.08;white-space:normal;overflow-wrap:break-word}
.fx-side.away .fx-tname{text-align:right}
.fx-dash{font-family:var(--fb);font-weight:600;font-size:10px;color:var(--faint);flex-shrink:0;margin-top:2px}
.fx-odds{display:flex;gap:6px}
.odd{flex:1;text-align:center;border-radius:9px;padding:6px 4px;background:var(--glass);border:1px solid var(--glassB)}
.odd.fav{background:rgba(70,227,154,.10);border-color:rgba(70,227,154,.35)}
.odd-label{font-family:var(--fb);font-weight:600;font-size:8.5px;letter-spacing:.8px;color:var(--faint);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.odd.fav .odd-label{color:var(--neon)}
.odd-val{font-family:var(--fd);font-weight:800;font-size:15px;color:var(--ink);margin-top:1px}
.odd.fav .odd-val{color:var(--neon)}
.fx-cap{font-family:var(--fb);font-weight:500;font-size:9.5px;color:var(--faint);margin-top:7px;text-align:center}
.fx-cap b{color:var(--soft);font-weight:500}
.odds-toggle{display:inline-flex;align-items:center;gap:5px;margin-top:9px;padding:0;
  background:none;border:none;cursor:pointer;font-family:var(--fb);font-weight:600;font-size:10.5px;
  letter-spacing:.3px;color:var(--neon);opacity:.8;transition:opacity .15s}
.odds-toggle:hover{opacity:1}
.odds-toggle svg{width:9px;height:9px;transition:transform .2s}
.odds-toggle.open svg{transform:rotate(180deg)}
.odds-wrap{margin-top:9px}

/* ── GROUPS OVERVIEW ── */
.groups{margin-top:13px}
.groups-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.gtile{background:var(--glass);border:1px solid var(--glassB);border-radius:12px;padding:9px 11px;cursor:pointer;transition:border-color .15s}
.gtile:hover{border-color:rgba(70,227,154,.4)}
.gtile.active{border-color:var(--neon);background:rgba(70,227,154,.07)}
.gtile-label{font-family:var(--fb);font-weight:700;font-size:9px;letter-spacing:1px;color:var(--neon);text-transform:uppercase;margin-bottom:7px}
.gtile-flags{display:flex;gap:5px;flex-wrap:wrap}
.gtile-flags img{width:22px;height:auto;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}

.empty{color:var(--faint);font-size:13px;padding:2.5rem 0;text-align:center}

/* ── FOOTER ── */
.footer{margin:16px 18px 0;padding-top:12px;border-top:1px dashed var(--glassB);text-align:center;
  font-family:var(--fb);font-weight:500;font-size:10px;color:var(--faint)}

/* ── TOAST ── */
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--neon);color:var(--on-accent);font-family:var(--fb);font-weight:700;font-size:12.5px;
  padding:.6rem 1.2rem;border-radius:20px;transition:transform .25s cubic-bezier(.34,1.56,.64,1);
  pointer-events:none;white-space:nowrap;z-index:999}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>

  document.getElementById('footer').innerHTML=`${tt().notAffiliated} · matchcal26 · <span id="oddsAge">${oddsAgeText}</span>`;
}
function applyI18n(){
  const L=tt();
  document.documentElement.lang=LANG;
  document.getElementById('teamLabel').textContent=L.yourTeam;
  document.getElementById('tzLabelText').textContent=L.timezone;
  document.getElementById('langText').textContent=LANG.toUpperCase();
  document.getElementById('langSelect').value=LANG;
  if(!tSel.value)document.getElementById('chipTeamText').textContent=L.allTeams;
  document.getElementById('nextMatchLabel').textContent=L.nextMatch;
  const u=[L.days,L.hrs,L.min,L.sec];
  document.querySelectorAll('.cd-unit').forEach((el,i)=>{if(u[i])el.textContent=u[i];});
  document.getElementById('groupsLabel').textContent=L.groups;
  updateFooter();
}
function setLang(l){
  if(!SUPPORTED.includes(l))l='en';
  LANG=l;LOCALE=LOCALES[l];
  applyI18n();buildGroupsGrid();render();
}
function onLangChange(){setLang(document.getElementById('langSelect').value);}

const pad=n=>String(n).padStart(2,'0');
const localStr=d=>d.toLocaleTimeString(LOCALE,{hour:'2-digit',minute:'2-digit',timeZone:userTZ});
const localDateLabel=d=>d.toLocaleDateString(LOCALE,{weekday:'short',day:'numeric',month:'short',timeZone:userTZ});
const localDow=d=>d.toLocaleDateString(LOCALE,{weekday:'short',timeZone:userTZ}).toUpperCase();
const localDay=d=>d.toLocaleDateString(LOCALE,{day:'numeric',timeZone:userTZ});
const localMon=d=>d.toLocaleDateString(LOCALE,{month:'short',timeZone:userTZ}).toUpperCase();
const icsDate=d=>d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';

function makeGCalURL(m){
  const s=icsDate(m.utc),e=icsDate(new Date(m.utc.getTime()+105*60000));
  return`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(`⚽ ${m.home} vs ${m.away} | World Cup 2026`)}&dates=${s}/${e}&details=${encodeURIComponent(`${m.group} · ${m.venue}, ${m.city}\nWatch: ${channel}`)}&location=${encodeURIComponent(`${m.venue}, ${m.city}`)}`;
}
function downloadICS(id){
  const m=MATCHES[id-1];
  const s=icsDate(m.utc),e=icsDate(new Date(m.utc.getTime()+105*60000));
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//matchcal26//EN','CALSCALE:GREGORIAN','BEGIN:VEVENT',`DTSTART:${s}`,`DTEND:${e}`,`SUMMARY:⚽ ${m.home} vs ${m.away} | World Cup 2026`,`DESCRIPTION:${m.group} · ${m.venue}\\nWatch: ${channel}`,`LOCATION:${m.venue}, ${m.city}`,'BEGIN:VALARM','TRIGGER:-PT60M','ACTION:DISPLAY','DESCRIPTION:Match in 1 hour','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`WC2026_${m.home}_vs_${m.away}.ics`;a.click();
  URL.revokeObjectURL(url);
  showToast(tt().addedOne);
}
function downloadAllICS(){
  const team=tSel.value;if(!team)return;
  const ms=MATCHES.filter(m=>(m.home===team||m.away===team)&&m.group.startsWith('Group '));
  if(!ms.length)return;
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//matchcal26//EN','CALSCALE:GREGORIAN'];
  ms.forEach(m=>{
    const s=icsDate(m.utc),e=icsDate(new Date(m.utc.getTime()+105*60000));
    lines.push('BEGIN:VEVENT',`DTSTART:${s}`,`DTEND:${e}`,`SUMMARY:⚽ ${m.home} vs ${m.away} | World Cup 2026`,`DESCRIPTION:${m.group} · ${m.venue}\\nWatch: ${channel}`,`LOCATION:${m.venue}, ${m.city}`,'BEGIN:VALARM','TRIGGER:-PT60M','ACTION:DISPLAY','DESCRIPTION:Match in 1 hour','END:VALARM','END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  const blob=new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`WC2026_${team}_group_matches.ics`;a.click();
  URL.revokeObjectURL(url);
  showToast(tt().addedAll(ms.length, team));
}
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2800);}

let activeGroup=null;
let oddsData={updated:null,matches:[]};
const teams=[...new Set(MATCHES.flatMap(m=>[m.home,m.away]).filter(t=>t!=='TBD'))].sort();
const tSel=document.getElementById('teamFilter');
teams.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;tSel.appendChild(o);});

function onTeamChange(){
  const team=tSel.value;
  const chip=document.getElementById('teamChip');
  const pf=document.getElementById('chipFlag'),pt=document.getElementById('chipTeamText');
  if(team&&FLAGS[team]){pf.src=flagSrc(team,18);pf.classList.add('visible');}
  else pf.classList.remove('visible');
  pt.textContent=team||'All teams';
  // chip is solid only when a team is chosen
  chip.classList.toggle('solid', !!team);
  // recolor caret + label to match chip state
  chip.querySelector('.caret path').setAttribute('stroke', team ? '#06231B' : '#EAF6F0');
  document.getElementById('teamLabel').style.color = team ? 'rgba(6,35,27,.55)' : 'var(--faint)';
  render();
}

let nextMatch=null;
function updateHero(){
  const team=tSel.value;
  const card=document.getElementById('hero');
  if(!team){card.style.display='none';return;}
  const now=Date.now();
  const next=MATCHES.filter(m=>(m.home===team||m.away===team)&&m.home!=='TBD'&&m.utc.getTime()>now-105*60000).sort((a,b)=>a.utc-b.utc)[0];
  if(!next){card.style.display='none';return;}
  nextMatch=next;card.style.display='block';
  document.getElementById('heroFlagH').src=flagSrc(next.home,80);
  document.getElementById('heroFlagA').src=flagSrc(next.away,80);
  document.getElementById('heroHome').textContent=next.home.toUpperCase();
  document.getElementById('heroAway').textContent=next.away.toUpperCase();
  document.getElementById('heroDate').textContent=`${localDateLabel(next.utc)} · ${localStr(next.utc)}`;
  document.getElementById('heroVenue').textContent=`${next.venue} · ${next.city}`;
  document.getElementById('heroGcal').href=makeGCalURL(next);
  document.getElementById('heroIcal').onclick=()=>downloadICS(next.id);
}

function tickCountdown(){
  if(!nextMatch)return;
  const diff=nextMatch.utc.getTime()-Date.now();
  if(diff<=0&&diff>-105*60000){
    document.getElementById('heroDate').textContent=tt().live;
    document.getElementById('heroCd').innerHTML=`<div class="live-now">${tt().kickoffLive}</div>`;return;
  }
  if(diff<=0){nextMatch=null;updateHero();render();return;}
  const s=Math.floor(diff/1000);
  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=pad(v);};
  set('cdDays',Math.floor(s/86400));set('cdHrs',Math.floor((s%86400)/3600));
  set('cdMin',Math.floor((s%3600)/60));set('cdSec',s%60);
}

function render(){
  updateHero();
  const teamF=tSel.value;
  document.getElementById('groupsSection').style.display=teamF?'none':'block';
  let matches=MATCHES;
  if(teamF)matches=matches.filter(m=>m.home===teamF||m.away===teamF);
  if(activeGroup)matches=matches.filter(m=>m.group===activeGroup);
  const wrap=document.getElementById('listWrap');
  if(!matches.length){wrap.innerHTML=`<div class="empty">${tt().noMatches}</div>`;return;}
  const GP=['Group A','Group B','Group C','Group D','Group E','Group F','Group G','Group H','Group I','Group J','Group K','Group L'];
  const KO=['Round of 32','Round of 16','Quarter-final','Semi-final','Third Place','Final'];
  const pl=m=>GP.includes(m.group)?'Group Stage':m.group;
  const sec={};matches.forEach(m=>{const l=pl(m);if(!sec[l])sec[l]=[];sec[l].push(m);});
  let html='';
  ['Group Stage',...KO].forEach(phase=>{
    const ms=sec[phase];if(!ms)return;
    const cnt=`${ms.length} ${ms.length>1?tt().matches:tt().match}`;
    html+=`<div class="sec-head" style="margin-top:18px"><span class="sec-name">${tPhase(phase)}</span><span class="sec-rule"></span><span class="sec-count">${cnt}</span></div>`;
    if(phase==='Group Stage'&&teamF){
      html+=`<button class="add-all" onclick="downloadAllICS()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 4h-1V2h-2v2H8V2H6v2H5C3.9 4 3 4.9 3 6v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zM5 8V6h14v2H5z"/></svg>
        ${tt().addAll(ms.length, teamF)}
      </button>`;
    }
    ms.forEach(m=>{
      const isTBD=m.home==='TBD';
      html+=`
      <div class="fx">
        <div class="fx-bar"></div>
        <div class="fx-in">
          <div class="fx-rail"><div class="fx-dow">${localDow(m.utc)}</div><div class="fx-day">${localDay(m.utc)}</div><div class="fx-mon">${localMon(m.utc)}</div></div>
          <div class="fx-main">
            <div class="fx-meta">
              <span class="fx-time"><b>${localStr(m.utc)}</b><span> · ${(m.group.startsWith('Group ')?groupLabel(m.group):tPhase(m.group)).toUpperCase()}</span></span>
              <button class="fx-cal" onclick="downloadICS(${m.id})">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 4h-1V2h-2v2H8V2H6v2H5C3.9 4 3 4.9 3 6v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zM5 8V6h14v2H5z"/></svg>
                + Cal
              </button>
            </div>
            <div class="fx-teams">
              <div class="fx-side">${flagImg(m.home,22)}<span class="fx-tname">${m.home.toUpperCase()}</span></div>
              <span class="fx-dash">—</span>
              <div class="fx-side away"><span class="fx-tname">${m.away.toUpperCase()}</span>${flagImg(m.away,22)}</div>
            </div>
            ${isTBD?'':oddsHtml(m.home,m.away,teamF)}
          </div>
        </div>
      </div>`;
    });
  });
  wrap.innerHTML=html;
}

const countryTeam={"CH":"Switzerland","DE":"Germany","FR":"France","ES":"Spain","PT":"Portugal","IT":"Italy","NL":"Netherlands","BE":"Belgium","AT":"Austria","PL":"Poland","GB":"England","US":"United States","AR":"Argentina","BR":"Brazil","JP":"Japan","MX":"Mexico","CA":"Canada","QA":"Qatar","MA":"Morocco","SN":"Senegal","GH":"Ghana","KR":"South Korea","AU":"Australia","SE":"Sweden","NO":"Norway","DZ":"Algeria","EG":"Egypt","UY":"Uruguay","CO":"Colombia","UZ":"Uzbekistan"};
const tzCountry={"Europe/Zurich":"CH","Europe/Bern":"CH","Europe/Berlin":"DE","Europe/Vienna":"AT","Europe/Rome":"IT","Europe/Paris":"FR","Europe/Madrid":"ES","Europe/Lisbon":"PT","Europe/Amsterdam":"NL","Europe/Brussels":"BE","Europe/Warsaw":"PL","Europe/London":"GB","Europe/Dublin":"GB","America/New_York":"US","America/Chicago":"US","America/Denver":"US","America/Los_Angeles":"US","America/Sao_Paulo":"BR","America/Manaus":"BR","America/Argentina/Buenos_Aires":"AR","America/Argentina/Cordoba":"AR","Asia/Tokyo":"JP","Asia/Seoul":"KR","Australia/Sydney":"AU","Australia/Melbourne":"AU"};
const langCountry={"de-ch":"CH","fr-ch":"CH","it-ch":"CH","de-at":"AT","de-de":"DE","fr-fr":"FR","fr-be":"BE","nl-be":"BE","pt-br":"BR","pt-pt":"PT","es-ar":"AR","es-mx":"MX","es-es":"ES","en-gb":"GB","en-us":"US","nl-nl":"NL","pl-pl":"PL","it-it":"IT","ja-jp":"JP","ko-kr":"KR"};
function disambiguate(code){const langs=[...(navigator.languages||[navigator.language])].map(l=>l.toLowerCase());for(const lang of langs){if(langCountry[lang])return langCountry[lang];}return code;}
function applyTeam(code){const team=countryTeam[code];if(!team)return;const opt=[...tSel.options].find(o=>o.value===team);if(!opt)return;tSel.value=team;onTeamChange();}
applyTeam(tzCountry[userTZ]||'');
(async()=>{
  const svcs=[
    ()=>fetch('https://api.country.is/').then(r=>r.json()).then(d=>d.country),
    ()=>fetch('https://ipwho.is/').then(r=>r.json()).then(d=>d.success&&d.country_code),
    ()=>fetch('https://ipapi.co/json/').then(r=>r.json()).then(d=>d.country_code),
  ];
  for(const svc of svcs){try{const c=await svc();if(c&&c.length===2){applyTeam(c);break;}}catch{}}
})();

// ── ODDS ──
function oddsKey(home,away){return `${home}__${away}`;}
function timeAgo(iso){const L=tt();const diff=Math.floor((Date.now()-new Date(iso))/60000);if(diff<2)return L.justNow;if(diff<60)return diff+L.minAgo;return Math.floor(diff/60)+L.hrAgo;}

// highlight = the SELECTED team's cell (lighter). No team selected → no highlight.
function oddsHtml(home,away,selectedTeam){
  const match=oddsData.matches.find(m=>oddsKey(m.home,m.away)===oddsKey(home,away));
  if(!match||!match.books.length)return'';
  const book=match.books[0];
  if(!book.home||!book.away)return'';
  const fmt=v=>v?v.toFixed(2):'—';
  const favHome=selectedTeam&&selectedTeam===home;
  const favAway=selectedTeam&&selectedTeam===away;
  const chevron=`<svg viewBox="0 0 9 6" fill="none"><path d="M1 1l3.5 3.5L8 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  return `
    <button class="odds-toggle" onclick="toggleOdds(this)">${tt().showOdds} ${chevron}</button>
    <div class="odds-wrap" style="display:none">
      <div class="fx-odds">
        <div class="odd${favHome?' fav':''}"><div class="odd-label">${home}</div><div class="odd-val">${fmt(book.home)}</div></div>
        <div class="odd"><div class="odd-label">${tt().draw}</div><div class="odd-val">${book.draw?fmt(book.draw):'—'}</div></div>
        <div class="odd${favAway?' fav':''}"><div class="odd-label">${away}</div><div class="odd-val">${fmt(book.away)}</div></div>
      </div>
      <div class="fx-cap">${tt().bookmakers} · <b>${book.name}</b></div>
    </div>`;
}

function toggleOdds(btn){
  const wrap=btn.nextElementSibling;
  const open=wrap.style.display==='none';
  wrap.style.display=open?'block':'none';
  btn.classList.toggle('open',open);
  const chevron=btn.querySelector('svg').outerHTML;
  btn.innerHTML=(open?tt().hideOdds+' ':tt().showOdds+' ')+chevron;
}

async function loadOdds(){
  try{
    const res=await fetch('./odds.json?t='+Date.now());
    if(!res.ok)return;
    oddsData=await res.json();
    render();
    if(oddsData.updated){oddsAgeText=tt().oddsUpdated+' '+timeAgo(oddsData.updated);updateFooter();}
  }catch{}
}

// ── GROUPS OVERVIEW ──
const GROUP_NAMES=['Group A','Group B','Group C','Group D','Group E','Group F','Group G','Group H','Group I','Group J','Group K','Group L'];
const groupTeams={};
MATCHES.forEach(m=>{if(!GROUP_NAMES.includes(m.group))return;if(!groupTeams[m.group])groupTeams[m.group]=new Set();if(m.home!=='TBD')groupTeams[m.group].add(m.home);if(m.away!=='TBD')groupTeams[m.group].add(m.away);});
function buildGroupsGrid(){
  const grid=document.getElementById('groupsGrid');
  grid.innerHTML=GROUP_NAMES.map(g=>{
    const flags=[...(groupTeams[g]||[])].map(t=>{const src=flagSrc(t,22);return src?`<img src="${src}" alt="${t}" title="${t}">`:'';}).join('');
    return `<div class="gtile${activeGroup===g?' active':''}" onclick="onGroupClick('${g}')"><div class="gtile-label">${groupLabel(g)}</div><div class="gtile-flags">${flags}</div></div>`;
  }).join('');
}
function onGroupClick(group){activeGroup=activeGroup===group?null:group;buildGroupsGrid();render();}
buildGroupsGrid();

applyI18n();
render();
loadOdds();
setInterval(tickCountdown,1000);
</script>
</body>
</html>
