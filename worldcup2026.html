<head>
<meta charset="UTF-8">

<title>World Cup 2026 — Match Calendar</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b1a0d;--surface:#132516;--card:#0f1f11;--hero:#162c19;
  --border:#1e3d22;--accent:#c8ff00;--green:#3ddc68;
  --text:#f0f0f0;--muted:#5a8060;--muted2:#8aab8e;--r:14px;
}
html{background:var(--bg)}
body{
  background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;
  min-height:100vh;font-size:15px;max-width:480px;margin:0 auto;padding:0 0 6rem;
}

/* ── APP BAR ── */
.app-bar{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.2rem .5rem}
.brand{display:flex;align-items:center;gap:.4rem;font-size:.72rem;font-weight:600;letter-spacing:.1em;color:var(--muted2);text-transform:uppercase}
.brand-sub{font-size:.65rem;color:var(--muted);letter-spacing:.06em;text-align:right;line-height:1.4}

/* ── PAGE TITLE ── */
.page-title-row{padding:.1rem 1.2rem .9rem;display:flex;align-items:center;gap:.5rem}
.page-title{font-family:'DM Sans',sans-serif;font-size:2.4rem;font-weight:700;line-height:1;color:var(--text)}
.live-dot{width:10px;height:10px;border-radius:50%;background:var(--green);display:inline-block;flex-shrink:0;margin-top:.15rem;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* ── FILTERS ── */
.filters{display:flex;gap:.5rem;padding:.2rem 1.2rem .9rem;flex-wrap:wrap}
.pill-wrap{
  position:relative;display:flex;align-items:center;
  background:var(--surface);border:1px solid var(--border);
  border-radius:20px;padding:.35rem .75rem;gap:.35rem;cursor:pointer;flex-shrink:0;
}
.pill-wrap select{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer;font-size:1rem}
.pill-flag{height:14px;width:auto;border-radius:1px;display:none}
.pill-flag.visible{display:inline-block}
.pill-text{font-size:.78rem;font-weight:500;color:var(--text);white-space:nowrap}
.pill-arrow{font-size:.58rem;color:var(--muted)}

/* ── NEXT MATCH HERO ── */
.next-card{
  margin:.2rem 1rem 1rem;background:var(--hero);
  border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.1rem 1.1rem;
}
.nm-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.9rem}
.nm-label{display:flex;align-items:center;gap:.4rem;font-size:.7rem;font-weight:700;letter-spacing:.1em;color:var(--green);text-transform:uppercase}
.nm-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 1.2s infinite;flex-shrink:0}
.nm-datetime{font-size:.75rem;color:var(--muted2)}

.nm-teams{display:flex;align-items:center;justify-content:space-around;margin-bottom:1rem}
.nm-team{display:flex;flex-direction:column;align-items:center;gap:.5rem;flex:1}
.nm-flag{width:64px;height:auto;border-radius:5px;box-shadow:0 2px 12px rgba(0,0,0,.5)}
.nm-name{font-weight:700;font-size:.92rem;letter-spacing:.04em;color:var(--text);text-align:center}
.nm-vs{color:var(--muted);font-size:.82rem;font-weight:300;flex-shrink:0;padding:0 .3rem}

.nm-countdown{display:flex;gap:.5rem;margin-bottom:.9rem}
.cd-box{flex:1;background:rgba(0,0,0,.28);border-radius:10px;padding:.55rem .3rem;text-align:center}
.cd-num{display:block;font-family:'Bebas Neue',sans-serif;font-size:2rem;line-height:1;color:var(--accent);letter-spacing:.04em}
.cd-unit{display:block;font-size:.58rem;font-weight:600;letter-spacing:.1em;color:var(--muted2);text-transform:uppercase;margin-top:.12rem}

.nm-venue{font-size:.74rem;color:var(--muted2);display:flex;align-items:center;gap:.35rem;margin-bottom:.85rem}
.nm-venue svg{width:11px;height:11px;flex-shrink:0;color:var(--green)}

.nm-btns{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.nm-btn{
  display:flex;align-items:center;justify-content:center;gap:.4rem;
  padding:.65rem;border-radius:10px;font-family:'DM Sans',sans-serif;
  font-size:.82rem;font-weight:600;cursor:pointer;text-decoration:none;
  border:none;transition:opacity .15s;
}
.nm-btn:hover{opacity:.82}
.nm-btn-google{background:var(--green);color:#061008}
.nm-btn-apple{background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--text)}
.nm-btn svg{width:13px;height:13px}

/* ── MATCH LIST ── */
.list-wrap{padding:0 1rem}
.phase-row{display:flex;align-items:center;justify-content:space-between;padding:.9rem 0 .5rem}
.phase-row:first-child{padding-top:.3rem}
.phase-name{font-size:.8rem;font-weight:700;letter-spacing:.1em;color:var(--text);text-transform:uppercase}
.phase-count{font-size:.75rem;color:var(--green);font-weight:500}

.match-card{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  margin-bottom:.45rem;display:grid;grid-template-columns:52px 1fr auto;
  overflow:hidden;transition:border-color .15s;
}
.match-card:hover{border-color:#2e5c33}
.match-card.has-odds{grid-template-rows:auto auto}

.mc-date{
  background:rgba(0,0,0,.22);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:.6rem .3rem;
  border-right:1px solid var(--border);flex-shrink:0;
}
.mc-dow{font-size:.58rem;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.mc-day{font-family:'Bebas Neue',sans-serif;font-size:1.65rem;line-height:1;color:var(--text);margin:.04rem 0}
.mc-mon{font-size:.58rem;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}

.mc-teams{padding:.55rem .65rem;display:flex;flex-direction:column;gap:.32rem;justify-content:center}
.mc-team{display:flex;align-items:center;gap:.42rem;font-size:.84rem;font-weight:600;color:var(--text)}
.mc-team img{border-radius:2px;flex-shrink:0}

/* odds */
.mc-odds{padding:.45rem .65rem .5rem;border-top:1px solid var(--border);display:flex;gap:.4rem;align-items:center;grid-column:1/-1}
.odds-book{font-size:.6rem;color:var(--muted);font-weight:500;flex-shrink:0;min-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.odds-vals{display:flex;gap:.3rem;flex:1}
.odds-btn{flex:1;text-align:center;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:6px;padding:.28rem .2rem;font-size:.72rem;font-weight:600;color:var(--text);cursor:default}
.odds-btn .odds-label{display:block;font-size:.52rem;color:var(--muted);font-weight:500;margin-bottom:.1rem}
.odds-updated{font-size:.6rem;color:var(--muted);padding:.3rem .65rem .45rem;grid-column:1/-1;text-align:right}

.mc-right{padding:.5rem .65rem;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:.2rem}
.mc-time{font-family:'Bebas Neue',sans-serif;font-size:1.28rem;letter-spacing:.04em;color:var(--text);line-height:1}
.mc-group{font-size:.6rem;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.mc-cal{
  display:flex;align-items:center;gap:.25rem;margin-top:.15rem;
  font-size:.64rem;font-weight:500;color:var(--muted);cursor:pointer;
  background:none;border:none;padding:0;font-family:'DM Sans',sans-serif;transition:color .15s;
}
.mc-cal:hover{color:var(--green)}
.mc-cal svg{width:9px;height:9px}

.empty{color:var(--muted);font-size:.88rem;padding:3rem 0;text-align:center}

/* ── GROUPS OVERVIEW ── */
.groups-section{padding:.2rem 1rem .5rem}
.groups-label{font-size:.72rem;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:.55rem}
.groups-grid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.group-tile{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:.5rem .6rem;cursor:pointer;transition:border-color .15s;
}
.group-tile:hover{border-color:#2e5c33}
.group-tile.active{border-color:var(--green);background:rgba(61,220,104,.06)}
.group-tile-label{font-size:.58rem;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:.35rem}
.group-tile-flags{display:flex;gap:.3rem;flex-wrap:wrap}
.group-tile-flags img{border-radius:2px;width:22px;height:auto}

/* ── FOOTER ── */
.footer{margin:1.5rem 1rem 0;border:1px dashed #1e3d22;border-radius:10px;padding:.55rem;font-size:.63rem;color:#2e5c33;text-align:center;letter-spacing:.05em}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--accent);color:#061008;font-weight:600;font-size:.8rem;
  padding:.55rem 1.2rem;border-radius:20px;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);
  pointer-events:none;white-space:nowrap;z-index:999;
}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>

function utcLabel(tz){
  const off=-new Date().getTimezoneOffset(); // fallback
  try{
    const s=new Date().toLocaleTimeString('en',{timeZone:tz,timeZoneName:'shortOffset'});
    const m=s.match(/GMT([+-]\d+(?::\d+)?)/);
    if(m)return`UTC${m[1]}`;
  }catch{}
  const sign=off>=0?'+':'-';
  return`UTC${sign}${String(Math.floor(Math.abs(off)/60)).padStart(2,'0')}:${String(Math.abs(off)%60).padStart(2,'0')}`;
}

const pad=n=>String(n).padStart(2,'0');
const localStr=d=>d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',timeZone:userTZ});
const localDateLabel=d=>d.toLocaleDateString([],{weekday:'short',day:'numeric',month:'short',timeZone:userTZ});
const localDow=d=>d.toLocaleDateString([],{weekday:'short',timeZone:userTZ}).toUpperCase();
const localDay=d=>d.toLocaleDateString([],{day:'numeric',timeZone:userTZ});
const localMon=d=>d.toLocaleDateString([],{month:'short',timeZone:userTZ}).toUpperCase();
const icsDate=d=>d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';

function makeGCalURL(m){
  const s=icsDate(m.utc),e=icsDate(new Date(m.utc.getTime()+105*60000));
  return`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(`⚽ ${m.home} vs ${m.away} | World Cup 2026`)}&dates=${s}/${e}&details=${encodeURIComponent(`${m.group} · ${m.venue}, ${m.city}\nWatch: ${channel}`)}&location=${encodeURIComponent(`${m.venue}, ${m.city}`)}`;
}
function downloadICS(id){
  const m=MATCHES[id-1];
  const s=icsDate(m.utc),e=icsDate(new Date(m.utc.getTime()+105*60000));
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//matchcal26//EN','CALSCALE:GREGORIAN','BEGIN:VEVENT',`DTSTART:${s}`,`DTEND:${e}`,`SUMMARY:⚽ ${m.home} vs ${m.away} | World Cup 2026`,`DESCRIPTION:${m.group} · ${m.venue}\\nWatch: ${channel}`,`LOCATION:${m.venue}, ${m.city}`,'BEGIN:VALARM','TRIGGER:-PT60M','ACTION:DISPLAY','DESCRIPTION:Match in 1 hour','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`WC2026_${m.home}_vs_${m.away}.ics`;a.click();
  URL.revokeObjectURL(url);
  showToast('✓ Added to Apple / Outlook Calendar');
}
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2800);}

let nextMatch=null;
function updateHero(){
  const team=tSel.value;
  const card=document.getElementById('nextCard');
  if(!team){card.style.display='none';return;}
  const now=Date.now();
  const next=MATCHES.filter(m=>(m.home===team||m.away===team)&&m.home!=='TBD'&&m.utc.getTime()>now-105*60000).sort((a,b)=>a.utc-b.utc)[0];
  if(!next){card.style.display='none';return;}
  nextMatch=next;card.style.display='block';
  document.getElementById('nmFlagH').src=flagSrc(next.home,80);
  document.getElementById('nmFlagA').src=flagSrc(next.away,80);
  document.getElementById('nmHome').textContent=next.home.toUpperCase();
  document.getElementById('nmAway').textContent=next.away.toUpperCase();
  document.getElementById('nmDatetime').textContent=`${localDateLabel(next.utc)} · ${localStr(next.utc)}`;
  document.getElementById('nmVenue').textContent=`${next.venue} · ${next.city}`;
  document.getElementById('nmGcal').href=makeGCalURL(next);
  document.getElementById('nmIcal').onclick=()=>downloadICS(next.id);
}

function tickCountdown(){
  if(!nextMatch)return;
  const diff=nextMatch.utc.getTime()-Date.now();
  if(diff<=0&&diff>-105*60000){
    ['cdDays','cdHrs','cdMin','cdSec'].forEach(id=>document.getElementById(id).textContent='--');
    document.getElementById('nmDatetime').textContent='🔴 LIVE NOW';return;
  }
  if(diff<=0){nextMatch=null;updateHero();render();return;}
  const s=Math.floor(diff/1000);
  document.getElementById('cdDays').textContent=pad(Math.floor(s/86400));
  document.getElementById('cdHrs').textContent=pad(Math.floor((s%86400)/3600));
  document.getElementById('cdMin').textContent=pad(Math.floor((s%3600)/60));
  document.getElementById('cdSec').textContent=pad(s%60);
}

function render(){
  updateHero();
  const teamF=tSel.value;
  let matches=MATCHES;
  if(teamF)matches=matches.filter(m=>m.home===teamF||m.away===teamF);
  if(activeGroup)matches=matches.filter(m=>m.group===activeGroup);
  const wrap=document.getElementById('listWrap');
  if(!matches.length){wrap.innerHTML='<div class="empty">No matches for this selection.</div>';return;}
  const GP=['Group A','Group B','Group C','Group D','Group E','Group F','Group G','Group H','Group I','Group J','Group K','Group L'];
  const KO=['Round of 32','Round of 16','Quarter-final','Semi-final','Third Place','Final'];
  const pl=m=>GP.includes(m.group)?'Group Stage':m.group;
  const sec={};matches.forEach(m=>{const l=pl(m);if(!sec[l])sec[l]=[];sec[l].push(m);});
  let html='';
  ['Group Stage',...KO].forEach(phase=>{
    const ms=sec[phase];if(!ms)return;
    html+=`<div class="phase-row"><span class="phase-name">${phase}</span><span class="phase-count">${ms.length} match${ms.length>1?'es':''}</span></div>`;
    ms.forEach(m=>{
      const odds = m.home !== 'TBD' ? oddsHtml(m.home, m.away) : '';
      html+=`
      <div class="match-card${odds ? ' has-odds' : ''}">
        <div class="mc-date"><div class="mc-dow">${localDow(m.utc)}</div><div class="mc-day">${localDay(m.utc)}</div><div class="mc-mon">${localMon(m.utc)}</div></div>

          <div class="mc-team">${flagImg(m.home,18)} ${m.home}</div>
          <div class="mc-team">${flagImg(m.away,18)} ${m.away}</div>
        </div>
        <div class="mc-right">
          <div class="mc-time">${localStr(m.utc)}</div>
          <div class="mc-group">${m.group}</div>
          <button class="mc-cal" onclick="downloadICS(${m.id})">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2.5" width="13" height="12" rx="2"/><line x1="1.5" y1="6.5" x2="14.5" y2="6.5"/><line x1="5" y1="1" x2="5" y2="4"/><line x1="11" y1="1" x2="11" y2="4"/></svg>
            + Cal
          </button>
        </div>
        ${odds}
      </div>`;
    });
  });
  wrap.innerHTML=html;
}

function disambiguate(code){
  const langs=[...(navigator.languages||[navigator.language])].map(l=>l.toLowerCase());
  for(const lang of langs){if(langCountry[lang])return langCountry[lang];}
  return code;
}
function applyTeam(code){
  const team=countryTeam[code];if(!team)return;
  const opt=[...tSel.options].find(o=>o.value===team);if(!opt)return;
  tSel.value=team;onTeamChange();
}

// ── ODDS ──────────────────────────────────────────────────────────────────────
let oddsData = { updated: null, matches: [] };

function oddsKey(home, away) {
  return `${home}__${away}`;
}

function timeAgo(iso) {
  const diff = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (diff < 2)   return 'just now';
  if (diff < 60)  return `${diff}m ago`;
  const h = Math.floor(diff / 60);
  return `${h}h ago`;
}

function oddsHtml(home, away) {
  const key = oddsKey(home, away);
  const match = oddsData.matches.find(m => oddsKey(m.home, m.away) === key);
  if (!match || !match.books.length) return '';

  const book = match.books[0];
  if (!book.home || !book.away) return '';

  const fmt = v => v ? v.toFixed(2) : '—';
  return `
    <div class="mc-odds">
      <span class="odds-book">${book.name}</span>
      <div class="odds-vals">
        <div class="odds-btn"><span class="odds-label">1</span>${fmt(book.home)}</div>
        ${book.draw ? `<div class="odds-btn"><span class="odds-label">X</span>${fmt(book.draw)}</div>` : ''}
        <div class="odds-btn"><span class="odds-label">2</span>${fmt(book.away)}</div>
      </div>
    </div>`;
}

async function loadOdds() {
  try {
    const res = await fetch('./odds.json?t=' + Date.now());
    if (!res.ok) return;
    oddsData = await res.json();
    render(); // re-render with odds
    if (oddsData.updated) {
      document.getElementById('oddsAge').textContent = 'updated ' + timeAgo(oddsData.updated);
    }
  } catch {}
}

// ── GROUPS OVERVIEW ───────────────────────────────────────────────────────────
const GROUP_NAMES = ['Group A','Group B','Group C','Group D','Group E','Group F',
                     'Group G','Group H','Group I','Group J','Group K','Group L'];

// Build map: group → unique teams (home sides only, in order)
const groupTeams = {};
MATCHES.forEach(m => {
  if (!GROUP_NAMES.includes(m.group)) return;
  if (!groupTeams[m.group]) groupTeams[m.group] = new Set();
  if (m.home !== 'TBD') groupTeams[m.group].add(m.home);
  if (m.away !== 'TBD') groupTeams[m.group].add(m.away);
});

function buildGroupsGrid() {
  const grid = document.getElementById('groupsGrid');
  grid.innerHTML = GROUP_NAMES.map(g => {
    const teams = [...(groupTeams[g] || [])];
    const flags = teams.map(t => {
      const src = flagSrc(t, 22);
      return src ? `<img src="${src}" alt="${t}" title="${t}">` : '';
    }).join('');
    const letter = g.replace('Group ', '');
    return `<div class="group-tile${activeGroup===g?' active':''}" onclick="onGroupClick('${g}')">
      <div class="group-tile-label">Group ${letter}</div>
      <div class="group-tile-flags">${flags}</div>
    </div>`;
  }).join('');
}

function onGroupClick(group) {
  // Toggle: clicking same group clears filter
  activeGroup = activeGroup === group ? null : group;
  buildGroupsGrid();
  render();
}

buildGroupsGrid();

render();
loadOdds();
