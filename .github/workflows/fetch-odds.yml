name: Fetch Odds

on:
  schedule:
    # Daytime: every 2 hours, 7am–9pm UTC, at :17 (off the top-of-hour to dodge GitHub cron congestion)
    - cron: '17 7,9,11,13,15,17,19,21 * * *'
    # Overnight: catch late North-American kick-offs that finish while Europe sleeps.
    # 03:30 UTC == 05:30 CEST (summer). Times in UTC: 01:30 CEST, 03:30 CEST, 05:30 CEST, 07:30 CEST.
    - cron: '30 23,1,3,5 * * *'
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Refresh scores from ESPN
        run: node scripts/backfill-scores.js

      - name: Fetch odds
        run: node scripts/fetch-odds.js
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Commit updated odds.json + scores.json
        run: |
          git config user.name  "odds-bot"
          git config user.email "bot@matchcal26.netlify.app"
          git add odds.json scores.json
          if git diff --staged --quiet; then
            echo "No odds/scores changes."
            exit 0
          fi
          git commit -m "chore: update odds"
          # Rebase onto latest main and push, retrying if the remote moved (handles detached HEAD)
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main || git rebase --abort
            if git push origin HEAD:main; then
              echo "Pushed on attempt $i" && exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "Push failed after retries" && exit 1
