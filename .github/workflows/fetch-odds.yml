name: Fetch Odds

on:
  schedule:
    # Every 2 hours, 7am–9pm UTC, at :17 (off the top-of-hour to avoid GitHub's cron congestion)
    - cron: '17 7,9,11,13,15,17,19,21 * * *'
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Fetch odds
        run: node scripts/fetch-odds.js
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Commit updated odds.json
        run: |
          git config user.name  "odds-bot"
          git config user.email "bot@matchcal26.netlify.app"
          git add odds.json
          if git diff --staged --quiet; then
            echo "No odds changes."
            exit 0
          fi
          git commit -m "chore: update odds [skip ci]"
          # Rebase onto latest main and push, retrying if the remote moved (handles detached HEAD)
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main || git rebase --abort
            if git push origin HEAD:main; then
              echo "Pushed on attempt $i" && exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "Push failed after retries" && exit 1
