name: Fetch Odds

on:
  schedule:
    # Every 2 hours, 6am–10pm UTC (no overnight calls)
    - cron: '0 6,8,10,12,14,16,18,20,22 * * *'
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Fetch odds
        run: node scripts/fetch-odds.js
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Commit updated odds.json
        run: |
          git config user.name  "odds-bot"
          git config user.email "bot@matchcal26.netlify.app"
          git add odds.json
          git diff --staged --quiet || (git commit -m "chore: update odds [skip ci]" && git push)
